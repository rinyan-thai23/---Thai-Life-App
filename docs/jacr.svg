<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background / Accent Gradients -->
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="glowPin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" flood-color="#e11d48" flood-opacity="0.4" />
    </filter>
  </defs>

  <g id="logo-container">
    <!-- Outer Elegant Frame / Border (Subtle) -->
    <rect x="25" y="25" width="550" height="550" rx="36" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="6 6" />
    <rect x="38" y="38" width="524" height="524" rx="28" fill="none" stroke="#0ea5e9" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Stylized Thailand Map Silhouette in the center-background -->
    <g transform="translate(160, 45) scale(0.55)" filter="url(#subtleShadow)">
      <!-- Stylized silhouette of Thailand -->
      <path d="M 235,50 
               C 260,40 285,45 305,65 
               C 325,85 345,110 330,140 
               C 315,170 335,195 380,205 
               C 425,215 440,240 435,280 
               C 430,320 380,350 340,360 
               C 300,370 280,390 270,420 
               C 265,435 255,480 250,530 
               C 245,580 235,640 230,700 
               C 225,750 215,800 205,840 
               C 195,810 185,740 190,690 
               C 195,640 205,580 205,530 
               C 205,480 195,440 185,410 
               C 165,350 145,320 150,270 
               C 155,220 170,180 190,140 
               C 210,100 215,60 235,50 Z" fill="url(#mapGrad)" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round" stroke-opacity="0.4" />

      <!-- Chiang Rai Highlight Pin Location (Northern Tip) -->
      <circle cx="255" cy="80" r="16" fill="#e11d48" filter="url(#glowPin)" />
      <circle cx="255" cy="80" r="28" fill="none" stroke="#e11d48" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="4 4" />
      <circle cx="255" cy="80" r="6" fill="#ffffff" />
    </g>

    <!-- Centerpiece Typography & Branding -->
    <!-- JACR Main Acronym -->
    <g text-anchor="middle">
      <text x="300" y="275" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif" font-size="94" font-weight="900" fill="url(#primaryTextGrad)">
        JACR
      </text>

      <!-- Decorative Divider Accent with Gold Node -->
      <line x1="160" y1="305" x2="260" y2="305" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <circle cx="300" cy="305" r="4.5" fill="url(#goldGrad)" />
      <line x1="340" y1="305" x2="440" y2="305" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

      <!-- Main Japanese Name: チェンライ日本人会 -->
      <text x="300" y="375" font-family="&#39;Hiragino Sans&#39;, &#39;Hiragino Kaku Gothic ProN&#39;, &#39;Noto Sans JP&#39;, &#39;Yu Gothic&#39;, Meiryo, sans-serif" font-size="40" font-weight="700" fill="#1e293b">
        チェンライ日本人会
      </text>

      <!-- Since Badge / Founded Label -->
      <g transform="translate(300, 435)">
        <rect x="-85" y="-22" width="170" height="34" rx="17" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="0" y="1" font-family="&#39;Montserrat&#39;, &#39;Arial&#39;, sans-serif" font-size="15" font-weight="700" fill="#475569" dominant-baseline="central">
          SINCE 2004
        </text>
      </g>
    </g>
  </g>
</svg>