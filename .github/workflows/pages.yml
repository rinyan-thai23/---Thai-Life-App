name: Update data and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *' # タイ翌朝5時 / 日本翌朝7時
    - cron: '30 9 * * *' # 宝くじのみ：タイ時間16:30
  workflow_dispatch:
    inputs:
      update:
        description: '更新対象（none は公開のみ）'
        type: choice
        default: all
        options: [all, daily, fx, lucky, holidays, lotto, none]

# Morning: daily FX/numbers and monthly holidays. Afternoon: lottery only.
concurrency:
  group: thai-life-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Update shared data
        if: (github.event_name == 'schedule' && github.event.schedule == '0 22 * * *') || (github.event_name == 'workflow_dispatch' && inputs.update != 'none' && inputs.update != 'lotto')
        env:
          UPDATE_MODE: ${{ inputs.update }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            UPDATE_MODE=daily
            if [ "$(TZ=Asia/Bangkok date +%d)" = "01" ]; then UPDATE_MODE=all; fi
          fi
          node scripts/update-data.mjs "$UPDATE_MODE"
      - name: Update lottery results
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.update == 'all' || inputs.update == 'lotto'))
        run: node scripts/update-lotto.mjs
      - name: Save shared data
        id: save
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/daily.json docs/lotto-latest.json
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          if ! git diff --cached --quiet; then
            git commit -m 'Update shared Thai Life data'
            git push origin HEAD:main
          elif [ "$EVENT_NAME" = "schedule" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.save.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.save.outputs.publish == 'true'
        with:
          path: docs
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
